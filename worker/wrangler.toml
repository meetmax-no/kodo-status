# Ko | Do · Vault — D-149 — vakten
#
# Cloudflare fordi GitHub Actions' cron aldri fyrte: to timer, ~24 tapte
# slots, null planlagte kjøringer. GitHubs egen dokumentasjon kaller det
# «best effort» og sier at køede jobber kan droppes. Cloudflares cron er en
# ekte planlegger — og vi har allerede databehandleravtale og TIA der.

name = "kodo-vakt"
main = "src/index.mjs"
compatibility_date = "2026-09-09"

# Ingen compatibility_flags: koden bruker bare standard web-API-er (fetch,
# AbortSignal.timeout, Response.json). Ingenting fra Node. Det er derfor den
# kan limes rett inn i Cloudflares nettleser-editor uten oppsett.

[triggers]
# Hvert 7. minutt.
#
# MERK: `*/7` er ikke «hvert sjuende minutt». Cron nullstiller på timen, så
# kjøringene faller på :00 :07 :14 :21 :28 :35 :42 :49 :56 — ni i timen, med
# et kort hopp på fire minutter ved timeskiftet.
#
# Om GitHub Pages' myke grense på 10 bygg i timen: vi lå på 12–13 i et helt
# døgn på `*/5`, uten én strupet build. Grensen er myk i praksis, ikke bare i
# ordlyd. Ni gir raskere deteksjon enn ti minutter uten å koste noe målbart.
#
# Gratisnivået gir 5 cron-triggere per konto; vi bruker én.
crons = ["*/7 * * * *"]

[observability]
enabled = true

# Hemmeligheter settes med `wrangler secret put <navn>`, ALDRI i denne fila:
#   INTERNAL_RPC_SECRET  — samme verdi som i Vercel. Bearer mot helse-endepunktene.
#   GITHUB_TOKEN         — fine-grained PAT, Contents: read+write, KUN kodo-status.
#   TELEGRAM_BOT_TOKEN   — samme bot som resten av varslingen.
#   TELEGRAM_CHAT_ID     — samme chat.
#   TRIGGER_SECRET       — beskytter den manuelle /-ruten. Valgfri, men uten den
#                          svarer manuell kjøring alltid 401.
